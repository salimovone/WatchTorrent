<!doctype html>
<html lang="uz">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direct ulanish testi</title>
<style>
  * { box-sizing: border-box }
  body { color-scheme: dark; background: #0e0f13; color: #f2f3f7; font: 16px/1.5 Roboto, sans-serif; margin: auto; padding: 16px; max-width: 44rem }
  section { background: #171920; border: 1px solid #2a2e3a; border-radius: 12px; padding: 14px; margin: 12px 0 }
  button { background: #493795; color: white; font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; margin: 4px 3px 4px 0 }
  button:disabled { opacity: .45 }
  textarea, pre { width: 100%; background: #0e0f13; color: inherit; padding: 8px; border-radius: 6px }
  textarea { display: block; margin: 5px 0; font: 14px monospace }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px }
  p, h2 { margin: 0 0 8px } h2 { font-size: 1rem }
</style>
<p role="status" id="status">Test yuklanmoqda… Agar bu yozuv qolsa, Android System WebView versiyasini Play Marketda tekshiring va yangilang.</p>
<section>
  <button id="offer">A · Offer yaratish</button>
  <div id="receive">
    <label for="input" id="prompt">B telefon · A yuborgan offer matnini joylang.</label>
    <textarea id="input" rows="3" spellcheck="false"></textarea>
    <button id="apply">Offer qabul qilish</button>
  </div>
  <div id="share" hidden>
    <label for="output" id="outputLabel"></label>
    <textarea id="output" rows="3" readonly></textarea>
    <button id="copy">Nusxalash</button> <span id="copyHint" role="status"></span>
  </div>
  <button id="confirm" hidden>A answer’ni qo‘lladi</button>
</section>
<button id="ping" disabled>Ping</button>
<button id="reset">Qayta boshlash</button>
<section>
  <h2>Diagnostika</h2>
  <pre id="states"></pre>
  <p id="candidates"></p><p id="pair"></p>
  <h2>Hodisalar</h2><pre id="log"></pre>
</section>
<script src="direct-connection.js"></script>
</html>
